<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Logo Confecciones DyM</title>
  <desc id="desc">Logo elegante para empresa de confecciones con monograma DyM, aguja e hilo.</desc>

  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D9B26F"/>
      <stop offset="100%" stop-color="#A9792C"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0E1B2B" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Fondo transparente -->
  <g filter="url(#softShadow)">
    <!-- Sello exterior -->
    <circle cx="600" cy="510" r="355" fill="#0E1B2B"/>
    <circle cx="600" cy="510" r="320" fill="none" stroke="url(#gold)" stroke-width="5"/>

    <!-- Hilo decorativo -->
    <path d="M320 545 C405 455, 470 690, 575 545 S760 390, 865 540"
          fill="none" stroke="url(#gold)" stroke-width="10" stroke-linecap="round"/>

    <!-- Monograma -->
    <text x="485" y="575" text-anchor="middle"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="230" font-weight="700" fill="#F7F3EA">D</text>
    <text x="603" y="565" text-anchor="middle"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="118" font-weight="700" font-style="italic" fill="url(#gold)">y</text>
    <text x="735" y="575" text-anchor="middle"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="230" font-weight="700" fill="#F7F3EA">M</text>

    <!-- Aguja -->
    <g transform="translate(675 270) rotate(32)">
      <rect x="0" y="0" width="18" height="255" rx="9" fill="url(#gold)"/>
      <ellipse cx="9" cy="20" rx="4.5" ry="10" fill="#0E1B2B"/>
      <path d="M9 255 L0 228 L18 228 Z" fill="url(#gold)"/>
    </g>

    <!-- Carretes / puntadas -->
    <path d="M410 725 H790" stroke="#F7F3EA" stroke-width="3" stroke-dasharray="16 14" stroke-linecap="round" opacity="0.85"/>
  </g>

  <!-- Nombre de marca -->
  <text x="600" y="960" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="72" font-weight="700" letter-spacing="8"
        fill="#0E1B2B">CONFECCIONES</text>

  <text x="600" y="1045" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="82" font-weight="700" letter-spacing="5"
        fill="#A9792C">DyM</text>

  <!-- Detalle inferior -->
  <path d="M430 1090 H770" stroke="#0E1B2B" stroke-width="3" stroke-linecap="round" opacity="0.55"/>
  <circle cx="600" cy="1090" r="8" fill="#A9792C"/>
</svg>
